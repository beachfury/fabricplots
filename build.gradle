plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java'
}

// Jar name carries the Minecraft target, e.g. fabricplots-0.1.0+26.1.2.jar (Fabric convention).
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // For sgui (added in v1.1). Harmless to leave here now.
    maven { url = 'https://maven.nucleoid.xyz' }
    // DraftSmith is not published yet. Restrict Maven Local to this one group so unrelated local
    // artifacts can never shadow Fabric/Maven Central dependencies.
    exclusiveContent {
        forRepository { mavenLocal() }
        filter { includeGroup "com.draftsmith" }
    }
    // For fabric-permissions-api (soft dependency — permission nodes when LuckPerms etc. is present).
    mavenCentral()
}

dependencies {
    // Minecraft 26.x is shipped unobfuscated with official Mojang names —
    // NO 'mappings' line; Loom 1.17 handles it. (See minecraft-26-fabric-toolchain notes.)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Server-side inventory GUIs (renders on vanilla + Bedrock-via-Geyser). Jar-in-Jar bundled
    // since 0.5.0 — server owners no longer install sgui separately (LGPL; JiJ is Patbox's
    // recommended distribution; the loader dedupes if another mod bundles it too).
implementation "eu.pb4:sgui:${project.sgui_version}"
include "eu.pb4:sgui:${project.sgui_version}"

    // The build editor (shapes, brushes, measure, clipboard, undo) — our own DraftSmith mod,
    // extracted from 0.4.0. Jar-in-Jar bundled, so plot users notice nothing. The +MC suffix
    // tracks this branch's minecraft_version automatically.
    implementation "com.draftsmith:draftsmith:${project.draftsmith_version}+${project.minecraft_version}"
    include "com.draftsmith:draftsmith:${project.draftsmith_version}+${project.minecraft_version}"

    // Optional economy integration — Patbox's Common Economy API (same maven as sgui). compileOnly:
    // NOT bundled and NOT required. It's provided at runtime only if the server runs a Common Economy
    // provider (e.g. Savs Common Economy). FabricPlots runs fine without it; economy is off by default.
    compileOnly "eu.pb4:common-economy-api:2.0.0"

    // Optional Placeholder API integration (same maven). compileOnly: %fabricplots:*% placeholders
    // register only when the placeholder-api mod is present at runtime.
    compileOnly "eu.pb4:placeholder-api:3.1.0-beta.1+26.2"

    // Optional permissions integration — fabric-permissions-api (the check API LuckPerms and
    // friends implement). compileOnly, same as DraftSmith: nodes activate only when a permissions
    // mod is present; without one, every default applies and behavior is exactly as before.
    compileOnly "me.lucko:fabric-permissions-api:0.7.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
