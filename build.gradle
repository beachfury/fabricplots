plugins {
    // Loom 1.17: 'net.fabricmc.fabric-loom' is the NO-REMAP variant (26.x unobfuscated);
    // obfuscated targets like 1.21.1 need the -remap plugin id.
    id 'net.fabricmc.fabric-loom-remap' version '1.17.12'
    id 'java'
}

// Jar name carries the Minecraft target, e.g. fabricplots-0.5.0+1.21.1.jar (Fabric convention).
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // For sgui / placeholder-api / common-economy-api.
    maven { url = 'https://maven.nucleoid.xyz' }
    // For the DraftSmith editor jar — built locally: run publishToMavenLocal in draftsmith-mod.
    mavenLocal()
}

dependencies {
    // 1.21.1 ships obfuscated — official Mojang mappings restore the names this code is written in.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Server-side inventory GUIs (renders on vanilla + Bedrock-via-Geyser). Must also be present at
    // runtime — sgui-1.6.1+1.21.1.jar goes in the server's mods folder alongside this mod.
    modImplementation "eu.pb4:sgui:1.6.1+1.21.1"

    // The build editor (shapes, brushes, measure, clipboard, undo) — our own DraftSmith mod,
    // extracted from 0.4.0. Jar-in-Jar bundled, so plot users notice nothing. The +MC suffix
    // tracks this branch's minecraft_version automatically.
    //
    // TODO(1.21.1 port): 0.0.0-stub is a LOCAL PLACEHOLDER — API classes with no-op bodies,
    // published to mavenLocal from C:\Users\rcham\AppData\Local\Temp\claude\draftsmith-stub-1211.
    // The real DraftSmith 1.21.1 build MUST replace it (set draftsmith_version back to a real
    // version) before any release; with the stub bundled the mod runs, but the editor
    // (/plot edit, editwand, brushes, tape…) is completely inert.
    modImplementation "com.draftsmith:draftsmith:${project.draftsmith_version}+${project.minecraft_version}"
    include "com.draftsmith:draftsmith:${project.draftsmith_version}+${project.minecraft_version}"

    // Optional economy integration — Patbox's Common Economy API (same maven as sgui). compileOnly:
    // NOT bundled and NOT required. It's provided at runtime only if the server runs a Common Economy
    // provider (e.g. Savs Common Economy). FabricPlots runs fine without it; economy is off by default.
    modCompileOnly "eu.pb4:common-economy-api:1.2.1"

    // Optional Placeholder API integration (same maven). compileOnly: %fabricplots:*% placeholders
    // register only when the placeholder-api mod is present at runtime.
    modCompileOnly "eu.pb4:placeholder-api:2.4.2+1.21"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
